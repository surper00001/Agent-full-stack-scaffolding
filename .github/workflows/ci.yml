name: CI

on:
  push:
    branches: [main, initial-setup, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端 CI ──
  backend:
    name: Backend Lint + Type Check + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: agent_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install pytest-asyncio pytest-cov

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: agent_user
          DB_PASSWORD: ci_password
          DB_NAME: agent_platform_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          APP_ENV: development
          HARNESS_SANDBOX_ENABLED: false
        run: uv run pytest tests/ -v --tb=short

  # ── 前端 CI ──
  frontend:
    name: Frontend Lint + Type Check + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run type-check

      - name: Run tests
        run: npm run test -- --reporter=verbose
