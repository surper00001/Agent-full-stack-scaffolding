version: "3.9"

# =============================================================================
# Enterprise AI Agent Platform — 生产环境 Docker Compose
# =============================================================================
# 启动: docker-compose -f docker-compose.prod.yml up -d
# 停止: docker-compose -f docker-compose.prod.yml down
# 查看日志: docker-compose -f docker-compose.prod.yml logs -f
# =============================================================================

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck_defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ==========================================================================
  # PostgreSQL — 主数据库
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-agent_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-agent_platform}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agent_user} -d ${DB_NAME:-agent_platform}"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

  # ==========================================================================
  # Redis — 缓存 + 会话 + LangGraph Checkpoint
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

  # ==========================================================================
  # Chroma — 向量数据库（当 VECTOR_STORE_TYPE=chroma 时启用）
  # ==========================================================================
  chroma:
    image: chromadb/chroma:latest
    container_name: agent-chroma
    restart: unless-stopped
    profiles:
      - chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

  # ==========================================================================
  # Qdrant — 向量数据库（当 VECTOR_STORE_TYPE=qdrant 时启用）
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    profiles:
      - qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

  # ==========================================================================
  # 后端 API 服务
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network
    volumes:
      - kb_data:/app/data

  # ==========================================================================
  # 前端静态文件服务（Nginx）
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

  # ==========================================================================
  # Nginx 反向代理（可选，用于统一入口 + SSL 终止）
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      <<: *healthcheck_defaults
    logging: *logging
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  qdrant_data:
    driver: local
  kb_data:
    driver: local
