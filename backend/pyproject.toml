[project]
name = "agent-platform"
version = "0.1.0"
description = "企业级 AI Agent 后端平台 - 基于 LangChain + LangGraph + FastAPI"
requires-python = ">=3.11"
authors = [
    { name = "dev", email = "dev@example.com" }
]
keywords = ["ai", "agent", "langchain", "langgraph", "fastapi", "llm"]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # AI / Agent 框架
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "tiktoken>=0.8.0",
    # LLM 提供商
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # 向量数据库
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "qdrant-client>=1.12.0",
    # 数据验证
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # 异步与工具
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    # 日志与监测（全开源方案）
    "loguru>=0.7.0",
    "langfuse>=2.60.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    # 安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Redis (可选，用于缓存与会话)
    "redis>=5.2.0",
    "scalar-fastapi>=1.8.2",
    "pyotp>=2.9.0",
    "pillow>=12.2.0",
    # 知识库文档解析
    "pdfplumber>=0.11.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "mammoth>=1.8.0",
    "camelot-py[cv]>=0.11.0",
    "opencv-python-headless>=4.10.0",
    # 知识库 OCR（中文）
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",
    # 知识库 Embedding & Reranker
    "sentence-transformers>=3.3.0",
    "FlagEmbedding>=1.3.0",
    "transformers>=4.48.0",
    "torch>=2.5.0",
    # 混合检索
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # 知识库 结构化数据处理
    "markdownify>=0.4.0",
    # Excel 处理
    "openpyxl>=3.1.0",
    "mineru[core]>=3.1.15",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "prometheus-client>=0.25.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b0",
    "opentelemetry-instrumentation-redis>=0.63b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "coverage>=7.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import 排序)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking-imports
]
ignore = [
    "E501",  # 行长度由 formatter 处理
    "B008",  # 允许函数参数默认值中使用 FastAPI Depends
    "B904",  # 允许在 except 中使用 raise from None
]

[tool.ruff.lint.per-file-ignores]
"src/agents/tools/__init__.py" = ["E402"]  # 有意图的延迟导入
"src/agents/tools/file_tools.py" = ["ARG002", "TC001"]  # 接口方法签名 + 运行时类型
"src/agents/tools/kb_search.py" = ["ARG002", "TC001"]
"src/agents/tools/network_tools.py" = ["ARG002", "TC001"]
"src/agents/tools/shell_tool.py" = ["ARG002", "TC001"]
"src/agents/tools/skill_tools.py" = ["ARG002", "TC001"]
"src/agents/tools/info.py" = ["ARG002", "TC001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = false
# ── 类型安全规则（排除过于严格的 disallow_any_generics）──
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true
warn_unreachable = true
warn_redundant_casts = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "loguru",
    "chromadb",
    "langchain.*",
    "langchain_core.*",
    "langgraph.*",
    "pdfplumber",
    "pymupdf",
    "fitz",
    "docx",
    "mammoth",
    "camelot.*",
    "cv2",
    "paddleocr",
    "paddle",
    "openpyxl",
    "sentence_transformers",
    "torch",
    "FlagEmbedding",
    "markdownify",
    "jieba",
    "rank_bm25",
    "jose",
]
ignore_missing_imports = true

# CI 中 uv sync 将源码作为 editable install，mypy 通过包元数据解析时
# 找不到 py.typed 标记触发 import-untyped。这些模块已由 mypy src/ 直接检查。
[[tool.mypy.overrides]]
module = [
    "src.agents.tools.kb_search",
    "src.agents.tools.file_tools",
    "src.agents.tools.network_tools",
    "src.agents.tools.shell_tool",
    "src.agents.tools.resume",
    "src.agents.tools.skill_tools",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: 单元测试",
    "integration: 集成测试，需要外部服务（数据库、LLM等）",
    "slow: 慢速测试",
    "eval: RAG 评估测试，需要已索引的知识库",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "coverage>=7.6.0",
    "alembic>=1.18.4",
    "ragas>=0.3.0",
    "datasets>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
only-include = ["src"]

[tool.uv]
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
